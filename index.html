<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>Starlink to Mobile — Powered by Telecel Cash</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

html,body{
height:100%;
margin:0;
padding:0;
}

:root{

--telecel:#e60023;
--telecel-dark:#b8001c;
--telecel-soft:#ffe5ea;

}

body{

font-family:"Plus Jakarta Sans",system-ui,Arial;

background:

radial-gradient(900px 300px at 50% -150px, rgba(230,0,35,0.25), transparent),

linear-gradient(180deg,#fff5f7,#ffe3e8);

display:flex;
align-items:center;
justify-content:center;

padding:18px;

color:#111;

}

.page{

width:100%;
max-width:960px;

background:#fff;

border-radius:20px;

padding:24px;

box-shadow:

0 25px 60px rgba(0,0,0,0.12),

inset 0 1px 0 rgba(255,255,255,0.8);

}

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:18px;

flex-wrap:wrap;

}

.title-block h1{

margin:0;

font-size:22px;

font-weight:800;

letter-spacing:-0.3px;

}

.title-block p{

margin:4px 0 0;

font-size:13px;

color:#555;

}

.powered{

display:flex;

align-items:center;

gap:8px;

font-size:12px;

color:#666;

}

.powered img{

height:26px;

}

.plans-grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:16px;

}

.plan-card{

position:relative;

overflow:hidden;

border-radius:16px;

padding:16px;

cursor:pointer;

border:1px solid rgba(0,0,0,0.05);

background:

linear-gradient(180deg,#fff,#fff);

transition:.2s;

}

.plan-card::before{

content:"";

position:absolute;

top:-40%;

right:-30%;

width:160px;

height:160px;

background:

radial-gradient(circle at center,

rgba(230,0,35,0.25),

transparent 70%);

filter:blur(20px);

}

.plan-card::after{

content:"";

position:absolute;

bottom:-40%;

left:-30%;

width:160px;

height:160px;

background:

radial-gradient(circle at center,

rgba(230,0,35,0.18),

transparent 70%);

filter:blur(18px);

}

.plan-card:hover{

transform:translateY(-4px) scale(1.02);

box-shadow:

0 18px 38px rgba(230,0,35,0.18);

border-color:var(--telecel);

}

.plan-tag{

font-size:11px;

background:var(--telecel-soft);

color:var(--telecel);

padding:4px 8px;

border-radius:999px;

display:inline-block;

margin-bottom:6px;

font-weight:600;

}

.plan-name{

font-weight:700;

font-size:16px;

margin-bottom:2px;

}

.plan-duration{

font-size:12px;

color:#666;

margin-bottom:6px;

}

.plan-price{

font-size:19px;

font-weight:800;

color:var(--telecel);

margin-bottom:8px;

}

.plan-cta{

font-size:12px;

font-weight:600;

color:#333;

}

.plan-art{

position:absolute;

top:8px;

right:8px;

opacity:.08;

width:70px;

}

.note{

margin-top:14px;

font-size:12px;

color:#555;

}

.modal-overlay{

position:fixed;

inset:0;

display:none;

background:rgba(0,0,0,0.45);

align-items:center;

justify-content:center;

padding:18px;

}

.modal-box{

background:#fff;

padding:20px;

border-radius:18px;

width:100%;

max-width:420px;

box-shadow:

0 30px 60px rgba(0,0,0,0.25);

}

.modal-title{

font-weight:800;

margin-bottom:6px;

}

.modal-details{

background:#fafafa;

border-radius:10px;

padding:10px;

margin-bottom:12px;

}

.btn{

border-radius:10px;

padding:10px 14px;

border:0;

cursor:pointer;

font-weight:700;

}

.btn-primary{

background:var(--telecel);

color:#fff;

}

.btn-primary:hover{

background:var(--telecel-dark);

}

.btn-ghost{

background:#eee;

}

.modal-footer{

display:flex;

justify-content:flex-end;

gap:10px;

}

@media(max-width:720px){

.plans-grid{

grid-template-columns:repeat(2,1fr);

}

}

@media(max-width:480px){

.plans-grid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>



<div class="page">



<header class="header">

<div class="title-block">

<h1>Starlink to Mobile</h1>

<p>Fast data powered by Telecel Cash</p>

</div>



<div class="powered">

<span>Powered by</span>

<img src="assets/telecel.svg">

</div>

</header>



<div class="plans-grid">



<button class="plan-card" data-plan-id="15gb">

<img src="assets/signal.svg" class="plan-art">

<div class="plan-tag">Light</div>

<div class="plan-name">15GB</div>

<div class="plan-duration">7 days</div>

<div class="plan-price">GHS 9.99</div>

<div class="plan-cta">Select →</div>

</button>



<button class="plan-card" data-plan-id="35gb">

<img src="assets/wifi.svg" class="plan-art">

<div class="plan-tag">Balanced</div>

<div class="plan-name">35GB</div>

<div class="plan-duration">14 days</div>

<div class="plan-price">GHS 19.99</div>

<div class="plan-cta">Select →</div>

</button>



<button class="plan-card" data-plan-id="50gb">

<img src="assets/rocket.svg" class="plan-art">

<div class="plan-tag">Heavy</div>

<div class="plan-name">50GB</div>

<div class="plan-duration">21 days</div>

<div class="plan-price">GHS 32.99</div>

<div class="plan-cta">Select →</div>

</button>



<button class="plan-card" data-plan-id="unlimited">

<img src="assets/infinity.svg" class="plan-art">

<div class="plan-tag">Unlimited</div>

<div class="plan-name">Monthly</div>

<div class="plan-duration">30 days</div>

<div class="plan-price">GHS 43.99</div>

<div class="plan-cta">Select →</div>

</button>



</div>



<div class="note">

Secure Telecel Cash payment. Plan activates after line registration.

</div>



</div>



</body>

</html>
